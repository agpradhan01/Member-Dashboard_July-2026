<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAPCHO Member Health Centers</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  /* ============================================================
     FONTS — edit these 3 lines to change fonts everywhere on
     the page. Nothing else needs to change.

     To use a Google Font instead of a system font: add a
     <link> tag for it above (same pattern as the old Fraunces/
     Inter/JetBrains Mono setup), then put its name here, e.g.
     --font-heading: 'Playfair Display', serif;
     ============================================================ */
  :root{
    --font-heading: Verdana, Geneva, sans-serif;
    --font-body: Verdana, Geneva, sans-serif;
    --font-mono: Verdana, Geneva, sans-serif;
  }

  :root{
    --color-1:#B2334F;
    --color-2:#B25833;
    --color-3:#B29633;
    --paper:#EEF2ED;
    --paper-2:#E4EAE1;
    --ink:#1F2E28;
    --ink-soft:#54655C;
    --line:#CBD5C6;
    --accent:var(--color-1);
    --accent-2:#7A2337;
    --white:#FBFAF7;
    --scale-low:var(--color-3);
    --scale-mid:var(--color-2);
    --scale-high:var(--color-1);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    height:100vh;
    display:flex;
    flex-direction:column;
  }

 

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
    background:var(--white);
    flex-wrap:wrap;
    gap:10px;
    z-index:10;
  
  }
  header.top h1{
    font-family:var(--font-heading);
    font-weight:500;
    font-size:24px;
    margin:0;
  }
  .legend{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .legend .dots{display:flex;align-items:flex-end;gap:18px;}
  .legend .item{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .legend .dot{
    border-radius:50%;
    background:#B25833;
    opacity:0.85;
  }

  /* ---------- Map ---------- */
  #mapContainer{flex:1;position:relative;}
  #map{position:absolute;inset:0;}

  /* ---------- Profile card (popup) ---------- */
  .leaflet-popup-content-wrapper{
    border-radius:6px;
    padding:0;
    background:var(--white);
  }
  .leaflet-popup-content{margin:0;width:340px !important;}
  .leaflet-popup-tip{background:var(--white);}
  .card{
    padding:20px 22px;
  }
  .card .org-name{
    font-family:var(--font-heading);
    font-weight:500;
    font-size:19px;
    margin:0 0 2px;
    line-height:1.2;
  }
  .card .org-meta{
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
.card .facts{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:#8A7228;
  border:1px solid #8A7228;
  border-radius:5px;
  overflow:hidden;
}
  .card .fact{
    background:var(--white);
    padding:9px 10px;
  }
  .card .fact .label{
    font-family:var(--font-mono);
    font-size:9.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:3px;
    line-height:1.3;
  }
  .card .fact .value{
    font-family:var(--font-heading);
    font-size:15px;
    font-weight:500;
    color:var(--ink);
  }

  /* ---------- Search ---------- */
  .search{
    position:absolute;
    top:10px;left:64px;
    width:min(340px, calc(100vw - 80px));
    z-index:1000;
  }
  .search input{
    width:100%;
    font-family:var(--font-body);
    font-size:13px;
    color:var(--ink);
    background:var(--white);
    border:1px solid var(--line);
    border-radius:5px;
    padding:10px 12px;
    box-shadow:0 1px 5px rgba(0,0,0,.18);
    outline:none;
  }
  .search input:focus{border-color:var(--color-2);}
  .search ul{
    list-style:none;
    margin:4px 0 0;
    padding:0;
    background:var(--white);
    border:1px solid var(--line);
    border-radius:5px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    max-height:320px;
    overflow-y:auto;
    display:none;
  }
  .search li{
    padding:9px 12px;
    cursor:pointer;
    border-bottom:1px solid var(--paper-2);
  }
  .search li:last-child{border-bottom:none;}
  .search li.active, .search li:hover{background:var(--paper);}
  .search li .n{font-size:13px;color:var(--ink);line-height:1.3;}
  .search li .m{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
  .search li.none{cursor:default;color:var(--ink-soft);font-size:13px;}
  .search li.none:hover{background:transparent;}

  #statusMsg{
    position:absolute;
    top:16px;left:50%;
    transform:translateX(-50%);
    background:var(--white);
    border:1px solid var(--line);
    padding:10px 16px;
    border-radius:5px;
    font-size:13px;
    color:var(--ink-soft);
    z-index:500;
    display:none;
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>AAPCHO Member Health Centers</h1>
    <div class="data-note">Based on data reported in HRSA Uniform Data System (UDS), 2021-2025 </div>
  </div>
  <div class="legend" id="legend" aria-label="Dot size legend"></div>
</header>

<div id="mapContainer">
  <div id="map"></div>
  <div class="search">
    <input id="searchInput" type="search" placeholder="Search by name, grant number or state…"
           autocomplete="off" aria-label="Search health centers">
    <ul id="searchResults" role="listbox"></ul>
  </div>
  <div id="statusMsg"></div>
</div>

<script>

/* ============================================================
   MAP SETUP
   View is centered/zoomed to comfortably include the mainland US,
   Hawaii, Alaska, and Caribbean/Pacific territories on one
   pannable world map (no separate insets needed — just pan/zoom).
   ============================================================ */
const map = L.map('map', { worldCopyJump: true }).setView([25, -105], 3);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 12
}).addTo(map);

const statusMsg = document.getElementById('statusMsg');

/* ============================================================
   COLOR + SIZE SCALE (by patient count)
   ============================================================ */
function colorForCount(count, min, max){
  const t = max > min ? (count - min) / (max - min) : 0.5;
  // interpolate between low (#F5E9C8) and high (#A6412B)
  const c1 = [178, 150, 51];  // #B29633 (color-3, mustard) — low end
  const c2 = [178, 51, 79];   // #B2334F (color-1, rose) — high end
  const r = Math.round(c1[0] + (c2[0]-c1[0]) * t);
  const g = Math.round(c1[1] + (c2[1]-c1[1]) * t);
  const b = Math.round(c1[2] + (c2[2]-c1[2]) * t);
  return `rgb(${r},${g},${b})`;
}

function radiusForCount(count, min, max){
  const t = max > min ? (count - min) / (max - min) : 0.5;
  return 6 + t * 18; // 6px to 24px
}

/* ============================================================
   DATA — loaded from orgs.json (same folder as this file).
   Each org needs: lat, lng, patientCount, plus a "facts" object
   with the 9 profile card fields (label -> display string).
   Regenerate orgs.json from build_dashboard_data.R.
   ============================================================ */
async function loadData(){
  statusMsg.style.display = 'block';
  statusMsg.textContent = 'Loading organizations…';
  try {
    const res = await fetch('orgs.json');
    if (!res.ok) throw new Error('orgs.json not found');
    const orgs = await res.json();
    statusMsg.style.display = 'none';
    renderMarkers(orgs);
  } catch (err) {
    statusMsg.textContent = "Could not load orgs.json — make sure it's in the same folder and you're viewing this via a web server, not a local double-clicked file.";
    console.error(err);
  }
}

function renderMarkers(orgs){
  const counts = orgs.map(o => Number(o.patientCount) || 0);
  const min = Math.min(...counts);
  const max = Math.max(...counts);
  const entries = [];   // {org, marker} pairs, used by the search box

  buildLegend(min, max);

  orgs.forEach(org => {
    const count = Number(org.patientCount) || 0;
    const marker = L.circleMarker([org.lat, org.lng], {
      radius: radiusForCount(count, min, max),
      fillColor: '#B25833',
      fillOpacity: 0.85,
      color: '#FBFAF7',
      weight: 2
    }).addTo(map);

    const factEntries = Object.entries(org.facts || {});

    const popupHtml = `
      <div class="card">
        <div class="org-name">${org.name}</div>
        <div class="org-meta">${org.grantNumber} · ${org.state}</div>
        <div class="facts">
          ${factEntries.map(([label, value]) => `
            <div class="fact">
              <div class="label">${label}</div>
              <div class="value">${value}</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    marker.bindPopup(popupHtml, { maxWidth: 360 });
    entries.push({ org, marker });
  });

  initSearch(entries);
}

/* ============================================================
   LEGEND — three example dots at the exact sizes used on the map,
   labeled with round patient counts that fall inside your data's
   range (so they update automatically if orgs.json changes).
   ============================================================ */
function buildLegend(min, max){
  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  if (!(max > min) || min <= 0) return;

  const lowStep  = Math.pow(10, Math.floor(Math.log10(min)));
  const highStep = 5 * Math.pow(10, Math.max(Math.floor(Math.log10(max)) - 1, 0));
  const low  = Math.ceil(min / lowStep) * lowStep;
  const high = Math.floor(max / highStep) * highStep;
  const mid  = Math.round(((low + high) / 2) / highStep) * highStep;
  const values = [...new Set([low, mid, high])].filter(v => v >= min && v <= max);

  const title = document.createElement('span');
  title.textContent = 'Patients served';
  legend.appendChild(title);

  const dots = document.createElement('div');
  dots.className = 'dots';
  values.forEach(v => {
    const item = document.createElement('div');
    item.className = 'item';
    const d = document.createElement('div');
    d.className = 'dot';
    const size = 2 * radiusForCount(v, min, max);
    d.style.width = d.style.height = size + 'px';
    const label = document.createElement('span');
    label.textContent = v.toLocaleString('en-US');
    item.append(d, label);
    dots.appendChild(item);
  });
  legend.appendChild(dots);
}

/* ============================================================
   SEARCH — matches name, grant number or state. Punctuation and
   case are ignored (so "lanai" finds LANA'I). Picking a result
   zooms to that health center and opens its card.
   ============================================================ */
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '');

function initSearch(entries){
  const input = document.getElementById('searchInput');
  const list  = document.getElementById('searchResults');
  let shown = [];
  let active = -1;

  entries.forEach(e => {
    e.key = norm(e.org.name) + ' ' + norm(e.org.grantNumber) + ' ' + norm(e.org.state);
  });

  function close(){ list.style.display = 'none'; active = -1; }

  function setActive(i){
    const items = list.querySelectorAll('li[data-i]');
    items.forEach(li => li.classList.remove('active'));
    active = i;
    if (i >= 0 && items[i]){ items[i].classList.add('active'); items[i].scrollIntoView({ block: 'nearest' }); }
  }

  function render(){
    const q = norm(input.value);
    list.innerHTML = '';
    if (!q){ close(); return; }
    shown = entries.filter(e => e.key.includes(q)).slice(0, 8);
    if (!shown.length){
      const li = document.createElement('li');
      li.className = 'none';
      li.textContent = 'No matching health centers';
      list.appendChild(li);
    } else {
      shown.forEach((e, i) => {
        const li = document.createElement('li');
        li.dataset.i = i;
        const n = document.createElement('div'); n.className = 'n'; n.textContent = e.org.name;
        const m = document.createElement('div'); m.className = 'm';
        m.textContent = e.org.grantNumber + (e.org.state ? ' · ' + e.org.state : '');
        li.append(n, m);
        li.addEventListener('mousedown', ev => { ev.preventDefault(); choose(i); });
        list.appendChild(li);
      });
    }
    list.style.display = 'block';
    setActive(shown.length ? 0 : -1);
  }

  function choose(i){
    const e = shown[i];
    if (!e) return;
    input.value = e.org.name;
    close();
    input.blur();
    const target = L.latLng(e.org.lat, e.org.lng);
    const zoom = Math.max(map.getZoom(), 7);
    const open = () => e.marker.openPopup();
    const there = map.getCenter().distanceTo(target) < 500 && map.getZoom() >= zoom;
    if (there){ open(); return; }
    map.once('moveend', open);
    map.flyTo(target, zoom, { duration: 1.2 });
  }

  input.addEventListener('input', render);
  input.addEventListener('focus', render);
  input.addEventListener('blur', () => setTimeout(close, 100));
  input.addEventListener('keydown', ev => {
    if (ev.key === 'ArrowDown'){ ev.preventDefault(); if (shown.length) setActive((active + 1) % shown.length); }
    else if (ev.key === 'ArrowUp'){ ev.preventDefault(); if (shown.length) setActive((active - 1 + shown.length) % shown.length); }
    else if (ev.key === 'Enter'){ ev.preventDefault(); if (active >= 0) choose(active); }
    else if (ev.key === 'Escape'){ input.value = ''; close(); input.blur(); }
  });
  // keep map drag/scroll from firing when interacting with the search box
  L.DomEvent.disableClickPropagation(input.parentElement);
  L.DomEvent.disableScrollPropagation(list);
}

loadData();
</script>

</body>
</html>
